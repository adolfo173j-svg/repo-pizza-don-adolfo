<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="shortcut icon" href="../imagen/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../contacto CSS/contacto.css">
</head>
<body>
    
<a href="../index.html" class="btn-inicio">INICIO</a>

<video autoplay muted loop id="video-fondo">
    <source src="../video/1986-Pizza-Hut-Pan-Pizza.mp4" type="video/mp4">
</video>

<div class="contenedor">
    <h1 class="titulo">¡¡Contactanos!!</h1>

    <div class="info-contacto">
            <div class="info-item">
                <h3>Telefono</h3>
                <p>+57 314 872 3992</p>
            </div>

            <div class="info-item">
                <h3>Direccion</h3>
                <p>Calle 101 # 45-67, San Jose de los Campanos</p>
            </div>

            <div class="info-item">
                <h3>Correo</h3>
                <p>pizzadonadolfo@gmail.com</p>
            </div>

            <div class="info-item">
                <h3>Horario</h3>
                <p>Lunes a Domingo: 10am - 10pm</p>
            </div>
        </div>

        <form class="formulario-contacto">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" placeholder="Tu nombre">
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input id="correo" type="email" placeholder="Tu correo">
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje aqui" rows="5"></textarea>
            </div>

            <input type="submit" value="Enviar mensaje">

        </form>

    </div>

</div>

</body>
</html>
