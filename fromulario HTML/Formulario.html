<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="shortcut icon" href="../imagen/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../formulario CSS/formulario.css">
</head>
<body>
    
<form action="">
    <fieldset>
    <legend>Ingrese su informacion</legend>
    <label for="name">Nombre</label>
    <input id="name" type="text" placeholder="Ingrese su nomrbre">
    <br>
    <label for="surname">Apellido</label>
    <input id="surname" type="text" placeholder="Ingrese su apellido">
    <br>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Ingrese su email">
    <br>
    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="Ingrese una contraseña">
    <br>
    <label for="direccion">Direccion</label>
    <input id="direccion" type="text" placeholder="ingrese su direccion">
    <br>
    <label for="pedido">Seleccione el Tipo de Pedido</label>
    <select name="pedidos" id="pedido">
    <option disabled selected>Selecciones el Tipo de Entrega</option>
    <option value="pedido-1">Domicilio</option>
    <option value="pedido-2">Ir a recojerlo</option>
    </select>

    </fieldset>

    <br><br>

    <fieldset>
    <legend>seleccion su tipo de pedidp</legend>
    <label for="pedido">pedido economico</label>
    <input id="pedido" type="radio" value="pedido economico" name="pedido">
    <br>
    <label for="pedido-familiar">pedido familiar</label>
    <input id="pedido-familiar" type="radio" value="pedido familiar" name="pedido">
    <br>
    <label for="pedido-personal">pedido personal</label>
    <input id="pedido-personal" type="radio" value="pedido personal" name="pedido">
    </fieldset>

    <br><br>
    
    <fieldset>
    <legend>Datos adicionales del pedido</legend>
    <label for="gaseosa">COCA-COlA</label>
    <input id="gaseosa" type="checkbox" value="gaseosa" name="adicionales">
    <br>
    <label for="piña">Desea piña</label>
    <input id="piña" type="checkbox" value="piña" name="adicionales">
    <br>
    <label for="jamon">Desea jamon</label>
    <input id="jamon" type="checkbox" value="jamon" name="adicionales">
    </fieldset>
    
    <br>
    
    <input type="submit">
    <input type="reset">

</form>

</body>
</html>
