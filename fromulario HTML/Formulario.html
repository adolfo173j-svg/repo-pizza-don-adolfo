<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="shortcut icon" href="../imagen/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../formulario CSS/formulario.css">
</head>
<body>

<form action="">

    <fieldset>
        <legend>Ingrese su informacion</legend>

        <div class="campo">
            <label for="name">Nombre</label>
            <input id="name" type="text" placeholder="Ingrese su nombre">
        </div>

        <div class="campo">
            <label for="surname">Apellido</label>
            <input id="surname" type="text" placeholder="Ingrese su apellido">
        </div>

        <div class="campo">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Ingrese su email">
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="Ingrese una contraseña">
        </div>

        <div class="campo">
            <label for="direccion">Direccion</label>
            <input id="direccion" type="text" placeholder="Ingrese su direccion">
        </div>

        <div class="campo">
            <label for="pedido">Tipo de Pedido</label>
            <select name="pedidos" id="pedido">
                <option disabled selected>Seleccione el Tipo de Entrega</option>
                <option value="pedido-1">Domicilio</option>
                <option value="pedido-2">Ir a recogerlo</option>
            </select>
        </div>

    </fieldset>

    <fieldset>
        <legend>Seleccione su tipo de pedido</legend>

        <div class="campo">
            <label for="pedido-grupal">Pedido gruppal</label>
            <input id="pedido-grupal" type="radio" value="pedido grupal" name="pedido">
        </div>

        <div class="campo">
            <label for="pedido-familiar">Pedido familiar</label>
            <input id="pedido-familiar" type="radio" value="pedido familiar" name="pedido">
        </div>

        <div class="campo">
            <label for="pedido-personal">Pedido personal</label>
            <input id="pedido-personal" type="radio" value="pedido personal" name="pedido">
        </div>

    </fieldset>

    <fieldset>
        <legend>Datos adicionales del pedido</legend>

        <div class="campo">
            <label for="gaseosa">Coca-Cola</label>
            <input id="gaseosa" type="checkbox" value="gaseosa" name="adicionales">
        </div>

        <div class="campo">
            <label for="pina">Desea un poco mas de pina</label>
            <input id="pina" type="checkbox" value="pina" name="adicionales">
        </div>

        <div class="campo">
            <label for="jamon">Desea un poco mas de jamon</label>
            <input id="jamon" type="checkbox" value="jamon" name="adicionales">
        </div>

    </fieldset>

    <input type="submit">
    <input type="reset">

</form>

</body>
</html>
